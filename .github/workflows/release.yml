name: Release with Multi-platform Binaries

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Build multi-platform binaries
        run: |
          bun test
          bun build --compile src/index.ts --outfile weather-linux-x64 --target=bun-linux-x64
          bun build --compile src/index.ts --outfile weather-linux-arm64 --target=bun-linux-arm64
          bun build --compile src/index.ts --outfile weather-windows-x64.exe --target=bun-windows-x64
          bun build --compile src/index.ts --outfile weather-macos-x64 --target=bun-darwin-x64
          bun build --compile src/index.ts --outfile weather-macos-arm64 --target=bun-darwin-arm64

      - name: Get version from package.json
        id: version
        run: echo "value=$(bun -e 'import p from "./package.json" with {type:"json"}; console.log(p.version)')" >> $GITHUB_OUTPUT

      - name: Create tag if needed (workflow_dispatch)
        if: github.event_name == 'workflow_dispatch'
        run: |
          TAG="v${{ steps.version.outputs.value }}"
          if ! git rev-parse "$TAG" >/dev/null 2>&1; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git tag "$TAG"
            git push origin "$TAG"
          fi

      - name: Determine tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "name=v${{ steps.version.outputs.value }}" >> $GITHUB_OUTPUT
          else
            echo "name=${{ github.ref_name }}" >> $GITHUB_OUTPUT
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.name }}
          name: Release ${{ steps.tag.outputs.name }}
          files: |
            weather-linux-x64
            weather-linux-arm64
            weather-windows-x64.exe
            weather-macos-x64
            weather-macos-arm64
          generate_release_notes: true
